version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_ziyad
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salam_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ziyad
    restart: always
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    networks:
      - salam_net

volumes:
  postgres_data:

networks:
  salam_net:
    driver: bridge